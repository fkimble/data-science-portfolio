name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Smoke demo
        run: python -m claimflow.cli demo --patients 800 --days 45 --seed 7
