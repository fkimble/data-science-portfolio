[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimflow-parity-lab"
version = "0.1.0"
description = "Synthetic healthcare prior-authorization and claims-denial drift analytics lab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Farrell Kimble" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3"
]

[project.scripts]
claimflow = "claimflow.cli:main"

[tool.setuptools.packages.find]
include = ["claimflow*"]
