[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care-route-equity-lab"
version = "0.1.0"
description = "Synthetic specialty-referral access, leakage, and equity analytics lab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Farrell Kimble" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3"
]

[project.scripts]
careroute = "careroute.cli:main"

[tool.setuptools.packages.find]
include = ["careroute*"]
