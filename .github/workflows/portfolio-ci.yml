name: portfolio-ci

on:
  push:
  pull_request:

jobs:
  build-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
      - name: Rebuild senior analyst reports
        run: python scripts/build_portfolio_reports.py
      - name: Run CareRoute tests
        run: PYTHONPATH=care-route-equity-lab python -m unittest discover -s care-route-equity-lab/tests
      - name: Run ClaimFlow tests
        run: PYTHONPATH=claimflow-parity-lab python -m unittest discover -s claimflow-parity-lab/tests
